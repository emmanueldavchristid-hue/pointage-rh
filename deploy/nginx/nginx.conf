worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 8m;
  # Limitation de débit de base (en plus des limites applicatives)
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  upstream app { server app:4000; keepalive 16; }

  # HTTP : uniquement le téléchargement de l'autorité locale + redirection vers HTTPS
  server {
    listen 80 default_server;
    location = /ca.crt {
      alias /etc/nginx/certs/ca.crt;
      default_type application/x-x509-ca-cert;
      add_header Content-Disposition 'attachment; filename="pointage-rh-ca.crt"';
    }
    location = /installer {
      default_type text/html;
      return 200 '<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Installer le certificat</title><body style="font-family:system-ui;max-width:560px;margin:40px auto;padding:0 20px;color:#111827"><h1 style="font-size:22px">Pointage RH : première connexion</h1><p>Pour que la caméra fonctionne, votre téléphone doit faire confiance au serveur de l\'entreprise.</p><p><a href="/ca.crt" style="display:inline-block;background:#2563EB;color:#fff;padding:12px 18px;border-radius:8px;text-decoration:none">Télécharger le certificat</a></p><h2 style="font-size:16px">Android</h2><p>Paramètres &rarr; Sécurité &rarr; Chiffrement et identifiants &rarr; Installer un certificat &rarr; Certificat CA &rarr; choisir le fichier téléchargé.</p><h2 style="font-size:16px">iPhone</h2><p>Ouvrir ce lien avec Safari, autoriser le profil, puis Réglages &rarr; Général &rarr; VPN et gestion de l\'appareil &rarr; installer le profil. Ensuite Réglages &rarr; Général &rarr; Informations &rarr; Réglages des certificats &rarr; activer la confiance totale.</p><p>Ouvrez ensuite <b>https://$host</b>.</p></body></html>';
    }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl default_server;
    http2 on;
    ssl_certificate     /etc/nginx/certs/fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /ca.crt { alias /etc/nginx/certs/ca.crt; default_type application/x-x509-ca-cert; }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # $remote_addr (et non $proxy_add_x_forwarded_for) : l'IP client ne peut pas être usurpée
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }
    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
